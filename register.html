<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Codyssey - Register</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="register.css">
</head>
<body>

  <div class="page">
    <h1 class="brand">The Codyssey</h1>

    <div class="card">
      <div class="card-content">
        <h2 class="card-title">Register</h2>

        <form class="register-form">
          <input type="email" name="email" placeholder="Email" required>
          <input type="text" name="username" placeholder="Username" required>
          <input type="password" name="password" placeholder="Password" required>
          <input type="password" name="confirm-password" placeholder="Confirm password" required>

          <p class="signin-line">Already have an account? <a href="#">sign in</a></p>

          <a href="map.html"><button type="submit" class="register-btn">Register</button></a>
        </form>
      </div>
    </div>
  </div>

</body>
</html>
