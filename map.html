<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Codyssey - Map</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="map.css">
</head>
<body>

  <div class="page">
<button class="logout-btn">Log out</button>

    <div class="map-card">
      
      <div class="path">
        <div class="dashed-line"></div>

        <a href="#" class="stop">
          <img src="Image/seal.png" alt="Troy" class="stop-seal">
          <span class="stop-label">Troy</span>
        </a>

        <a href="#" class="stop">
          <img src="Image/seal.png" alt="Cyclopes" class="stop-seal">
          <span class="stop-label">Cyclopes</span>
        </a>

        <a href="#" class="stop">
          <img src="Image/seal.png" alt="The Sirens" class="stop-seal">
          <span class="stop-label">The Sirens</span>
        </a>

        <a href="#" class="stop">
          <img src="Image/seal.png" alt="Ithaca" class="stop-seal">
          <span class="stop-label">Ithaca</span>
        </a>
      </div>
    </div>

  </div>

</body>
</html>
